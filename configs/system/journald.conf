[Journal]
# Storage behavior
Storage=persistent
Compress=yes
Seal=no
SyncIntervalSec=5m

# Rate limiting
RateLimitIntervalSec=30s
RateLimitBurst=3000

# Retention and disk safety
SystemMaxUse=512M
SystemKeepFree=1G

# Log forwarding
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
