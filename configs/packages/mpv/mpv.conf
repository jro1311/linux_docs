# High quality profile
profile=high-quality

# Enables hardware decoding
--hwdec=auto

# Audio filter
af=lavfi=[loudnorm=I=-23:LRA=10:tp=-1:linear=false]

# Sets the default audio and subtitle language
#alang=eng
#slang=eng

# Sets the default audio and subtitle track number
#aid=2
#sid=2
#sub-auto=fuzzy
